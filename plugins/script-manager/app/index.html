<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Script Manager</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f6f6f6;
      --surface: #fff;
      --raised: #f1f1f1;
      --hover: #e8e8e8;
      --selected: #e6eef8;
      --text: #1c1c1c;
      --muted: #626262;
      --border: #d8d8d8;
      --control-border: #bcbcbc;
      --primary: #252525;
      --on-primary: #fff;
      --blue: #1672d4;
      --green: #238725;
      --amber: #905200;
      --danger: #a22424;
      --mono: "SF Mono", Menlo, ui-monospace, monospace;
      font: 14px/1.45 "Avenir Next", "PingFang SC", "Segoe UI", sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #171717;
      --surface: #161616;
      --raised: #222;
      --hover: #2c2c2c;
      --selected: #2d3034;
      --text: #ededed;
      --muted: #afafaf;
      --border: #363636;
      --control-border: #545454;
      --primary: #f0f0f0;
      --on-primary: #151515;
      --blue: #3297ff;
      --green: #6bdb64;
      --amber: #f6c267;
      --danger: #ff9d9d;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--background); color: var(--text); }
    h1, h2, p { margin: 0; }
    button, input, select { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .55; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon { width: 1.25em; height: 1.25em; flex: none; vertical-align: middle; }
    .icon-definitions { position: absolute; width: 0; height: 0; overflow: hidden; }
    .sr-only, .clipboard-buffer {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .app {
      display: flex;
      flex-direction: column;
      padding: calc(12px + var(--safe-top, 0px)) calc(clamp(16px, 2.2vw, 34px) + var(--safe-right, 0px))
        calc(24px + var(--safe-bottom, 0px)) calc(clamp(16px, 2.2vw, 34px) + var(--safe-left, 0px));
    }
    :root[data-display-mode="fullscreen"] { overflow: hidden; }
    :root[data-display-mode="fullscreen"] .app { height: 100dvh; }
    .masthead, .heading, .panel-header, .toolbar, .button, .actions, .log-footer, .log-context {
      display: flex;
      align-items: center;
    }
    .masthead, .log-header, .log-footer, .log-context { justify-content: space-between; gap: 12px; }
    .masthead { flex: none; padding-bottom: 12px; }
    .masthead .counts, .project-heading .counts { flex: none; color: var(--muted); font-size: 13px; }
    .masthead .counts { margin-inline-start: clamp(2px, 1vw, 18px); }
    .heading { min-width: 0; gap: 11px; }
    .masthead .heading { font-size: clamp(19px, 1.9vw, 26px); }
    .masthead-icon { width: 1em; height: 1em; flex: none; }
    h1 { font-size: inherit; line-height: 1.25; font-weight: 700; letter-spacing: -.025em; }
    h2 { font-size: 18px; line-height: 1.25; font-weight: 700; letter-spacing: -.018em; }
    .panel-header { flex: none; min-height: 52px; padding-block: 8px; }
    .brand-icon {
      display: grid;
      width: 33px;
      height: 31px;
      flex: none;
      place-items: center;
      border: 1px solid var(--control-border);
      border-radius: 8px;
      background: var(--raised);
    }
    .brand-icon img { display: block; width: 18px; height: 18px; }
    .button {
      display: inline-flex;
      justify-content: center;
      min-height: 34px;
      gap: 7px;
      padding: 5px 12px;
      border: 1px solid var(--control-border);
      border-radius: 8px;
      background: var(--raised);
      white-space: nowrap;
    }
    .button.icon-only { inline-size: 34px; padding-inline: 0; border: 0; background: transparent; }
    .button:not(:disabled):hover { background: var(--hover); }
    .button.primary { border-color: var(--primary); background: var(--primary); color: var(--on-primary); font-weight: 700; }
    .button.primary:not(:disabled):hover { opacity: .88; background: var(--primary); }
    .actions { gap: 8px; }
    .project-path-form { display: flex; gap: 8px; max-width: 600px; }
    .project-path-form .search { flex-basis: 12ch; }

    .board {
      display: grid;
      grid-template-columns: minmax(0, 1.47fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      min-height: 0;
      height: 580px;
      flex: none;
      gap: clamp(12px, 1.4vw, 22px);
      margin-top: 16px;
    }
    :root[data-display-mode="fullscreen"] .board { height: auto; flex: 1; }
    .workspace, .terminal { min-width: 0; min-height: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
      grid-template-rows: minmax(0, 1fr);
    }
    .project-panel, .script-panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .project-panel { border-inline-end: 1px solid var(--border); padding: 0 8px 8px; }
    .project-heading { margin-inline: 3px; }
    .project-panel .search { flex: none; margin: 9px 3px 10px; }
    .search {
      display: flex;
      align-items: center;
      min-width: 0;
      flex: 1;
      gap: 7px;
      padding: 0 9px;
      border: 1px solid var(--control-border);
      border-radius: 7px;
      background: var(--raised);
      color: var(--muted);
    }
    .search:focus-within { outline: 2px solid var(--blue); outline-offset: 1px; }
    .search input {
      width: 100%;
      min-width: 0;
      height: 33px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
    }
    .search input::placeholder { color: var(--muted); }
    .project-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-height: 0;
      margin: 0;
      padding: 2px 0;
      overflow: auto;
      overscroll-behavior: contain;
      overflow-anchor: none;
      list-style: none;
    }
    .project-button {
      display: flex;
      align-items: center;
      width: 100%;
      min-width: 0;
      gap: 8px;
      min-height: 37px;
      padding: 4px 8px 4px 13px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      text-align: start;
    }
    .project-button:hover { background: var(--hover); }
    .project-button:focus-visible { outline-offset: -2px; }
    .project-button[aria-pressed="true"] { background: var(--selected); font-weight: 700; }
    .project-button[data-missing] { color: var(--muted); }
    .project-button .pin { width: 13px; height: 13px; }
    .project-button .project-active {
      width: 8px;
      height: 8px;
      flex: none;
      margin-inline-start: auto;
      border-radius: 50%;
      background: var(--green);
    }
    .project-caption { color: var(--muted); font-size: 12px; padding: 8px 10px; }

    .script-panel { padding: 0 9px; }
    .scope-header {
      position: relative;
      justify-content: space-between;
      gap: 8px;
      padding-inline: 4px;
    }
    .scope-info { display: flex; align-items: center; min-width: 0; gap: 9px; }
    .scope-info h2 { flex: none; max-inline-size: 58%; }
    .scope-info .icon { width: 20px; height: 20px; }
    .project-path { display: flex; min-width: 0; white-space: nowrap; color: var(--muted); font-size: 12px; }
    .path-start { min-width: min(1em, 100%); }
    .path-end { display: flex; justify-content: flex-end; min-width: 0; flex-shrink: .5; overflow: hidden; }
    .path-end > span { flex: none; }
    .command-config-error {
      flex: none;
      margin: 8px 2px 0;
      padding: 5px 8px;
      border-inline-start: 2px solid var(--danger);
      color: var(--danger);
      overflow-wrap: anywhere;
      font-size: 12px;
    }
    .toolbar { flex: none; flex-wrap: wrap; gap: 8px; padding: 9px 2px; }
    .toolbar .search { min-width: 86px; }
    .package-filter { position: relative; min-width: 82px; max-width: min(34%, 190px); }
    .package-filter select {
      appearance: none;
      width: 100%;
      height: 35px;
      padding: 0 23px 0 8px;
      overflow: hidden;
      border: 1px solid var(--control-border);
      border-radius: 7px;
      background: var(--raised);
      color: var(--text);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .package-filter .icon { position: absolute; inset-inline-end: 6px; top: 11px; width: 12px; height: 12px; pointer-events: none; }
    .filters {
      display: flex;
      flex: none;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--control-border);
      border-radius: 7px;
      background: var(--raised);
    }
    .filter {
      min-width: 39px;
      min-height: 29px;
      padding: 2px 7px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      font-weight: 600;
    }
    .filter[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
    .toolbar[data-external] > :not(#external-processes, #external-refresh) { display: none; }
    .external-list { list-style: none; margin: 0; padding: 0 2px 8px; }
    .external-row { display: block; text-align: start; padding-block: 6px; }
    .external-row > span { display: block; }
    .external-row .log-detail { font-weight: 400; }
    .external-feedback { margin: 4px 2px; }
    .external-log-header { flex-wrap: wrap; }
    .external-log-header .package-filter { max-width: min(58%, 240px); }
    .external-confirm { flex: none; padding: 8px 12px; border-top: 1px solid var(--border); }
    .external-confirm p { margin-bottom: 6px; overflow-wrap: anywhere; }
    .external-confirm .button:last-child { color: var(--danger); }

    .table-frame { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; overflow-anchor: none; scrollbar-gutter: stable; }
    .scripts { width: 100%; border-spacing: 0; table-layout: fixed; }
    .scripts col:nth-child(1) { width: 40px; }
    .scripts col:nth-child(2) { width: 40%; }
    .scripts col:nth-child(3) { width: 35%; }
    .scripts col:nth-child(4) { width: auto; }
    .scripts th, .scripts td { text-align: start; }
    .scripts thead { position: sticky; top: 0; z-index: 1; background: var(--surface); }
    .scripts th { padding: 4px 6px 7px; font-weight: 500; }
    .directory-heading th { padding: 4px 0 2px; }
    .directory-toggle {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 30px;
      gap: 7px;
      padding: 4px 8px;
      border: 0;
      border-radius: 6px;
      background: var(--raised);
      text-align: start;
      font-size: 12px;
    }
    .directory-toggle:hover { background: var(--hover); }
    .directory-toggle:focus-visible { outline-offset: -2px; }
    .directory-toggle[aria-expanded="false"] .icon { transform: rotate(-90deg); }
    .directory-name { font-weight: 700; }
    .directory-path, .directory-count { color: var(--muted); }
    .directory-count { flex: none; margin-inline-start: auto; }
    .directory-errors p { margin: 4px 6px; }
    .project-menu { position: relative; display: flex; }
    .project-menu .button { min-height: 31px; }
    .project-menu-options {
      position: absolute;
      z-index: 2;
      inset-block-start: calc(100% + 4px);
      inset-inline-end: 0;
      min-width: 128px;
      padding: 4px;
      background: var(--raised);
      border: 1px solid var(--control-border);
      border-radius: 8px;
      box-shadow: 0 6px 16px #0003;
    }
    .project-menu-options button {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 8px;
      padding: 6px 9px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      text-align: start;
      white-space: nowrap;
    }
    .project-menu-options button:hover { background: var(--hover); }
    .script-row[data-loggable] { cursor: pointer; }
    .script-row td { height: 37px; padding: 3px 6px; }
    .script-row:hover td, .script-row:has(:focus-visible) td { background: var(--hover); }
    .script-row td:first-child { border-start-start-radius: 6px; border-end-start-radius: 6px; text-align: center; }
    .script-row td:last-child { border-start-end-radius: 6px; border-end-end-radius: 6px; }
    .script-select { display: grid; width: 100%; min-width: 0; padding: 2px 0; border: 0; background: transparent; text-align: start; }
    .script-select:focus-visible { outline-offset: 0; }
    .script-main { display: flex; flex-wrap: wrap; align-items: baseline; min-width: 0; gap: 0 5px; }
    .script-name, .script-package { max-width: 100%; }
    .script-name { font-weight: 700; }
    .script-package, .command { color: var(--muted); font-size: 12px; }
    .command, .terminal-output { font-family: var(--mono); }
    .command { display: block; }
    .candidate-row td { vertical-align: top; padding-block: 7px; }
    .candidate-row .script-name { overflow-wrap: anywhere; }
    .candidate-command { overflow-wrap: anywhere; white-space: pre-wrap; }
    .candidate-directory { display: block; margin-top: 2px; }
    .candidate-add { max-width: 100%; min-height: 26px; padding: 2px 6px; font-size: 12px; }
    .status { display: inline-flex; align-items: center; max-width: 100%; min-width: 0; gap: 6px; font-size: 12px; }
    .status::before { content: ""; width: 8px; height: 8px; flex: none; border-radius: 50%; background: currentColor; }
    .status[data-kind="active"], .status[data-kind="succeeded"] { color: var(--green); }
    .status[data-kind="stopping"] { color: var(--amber); }
    .status[data-kind="failed"] { color: var(--danger); }
    .status[data-kind="idle"], .status[data-kind="stopped"] { color: var(--muted); }
    .script-action { width: 30px; max-width: 100%; min-height: 28px; padding: 0; }
    .script-action .icon { width: 15px; height: 15px; }
    .empty { padding: 12px 16px; }
    .terminal { display: flex; flex-direction: column; }

    .terminal[hidden] { display: none; }
    .log-header, .log-context, .log-footer { padding-inline: 12px; background: var(--raised); }
    .log-context, .log-footer { padding-block: 8px; }
    .log-header { border-radius: 9px 9px 0 0; }
    .log-header .heading { gap: 8px; }
    .log-header .button { min-height: 31px; }
    .log-header .icon-button { padding-inline: 8px; gap: 0; }
    .log-header .icon-button[data-copied="true"] { color: var(--green); }
    .log-tabs {
      display: flex;
      flex: none;
      align-items: stretch;
      gap: 3px;
      padding: 3px 6px 0;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-width: thin;
      border-top: 1px solid var(--border);
      background: var(--raised);
    }
    .log-tab-item {
      display: flex;
      flex: none;
      align-items: center;
      max-width: min(230px, 78%);
      border-bottom: 2px solid transparent;
      border-radius: 5px 5px 0 0;
      color: var(--muted);
    }
    .log-tab-item:hover, .log-tab-item[data-selected] { background: var(--surface); color: var(--text); }
    .log-tab-item[data-selected] { border-bottom-color: var(--blue); }
    .log-tab {
      display: inline-flex;
      flex: 1;
      align-items: center;
      gap: 6px;
      min-width: 0;
      min-height: 30px;
      padding: 4px 3px 4px 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      text-align: start;
      font-size: 12px;
    }
    .log-tab:focus-visible { outline-offset: -2px; }
    .log-tab .status { flex: none; }
    .log-tab .status::before { width: 7px; height: 7px; }
    .log-tab-close {
      display: grid;
      flex: none;
      width: 24px;
      height: 24px;
      place-items: center;
      margin-inline-end: 3px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
    }
    .log-tab-close:not(:disabled):hover { background: var(--hover); }
    .log-tab-close .icon { width: 15px; height: 15px; }
    .log-panel { display: flex; flex: 1; flex-direction: column; min-height: 0; }
    .log-context { border-top: 1px solid var(--border); }
    .log-title { font-size: 16px; font-weight: 700; }
    .log-detail { color: var(--muted); font-size: 12px; }
    .terminal-output {
      flex: 1;
      min-height: 0;
      margin: 0;
      padding: 12px 14px;
      overflow: auto;
      overscroll-behavior: contain;
      border-block: 1px solid var(--border);
      white-space: pre;
      font-size: 14px;
      line-height: 1.55;
    }
    .terminal-output[data-empty] { color: var(--muted); white-space: pre-wrap; }
    .terminal-output .log-error { color: var(--danger); }
    .log-footer { border-radius: 0 0 9px 9px; }
    .log-fix { min-height: 27px; padding: 2px 9px; font-size: 12px; }
    .scroll-switch { display: flex; align-items: center; gap: 7px; margin-inline-start: auto; cursor: pointer; font-size: 13px; user-select: none; }
    .scroll-switch input {
      appearance: none;
      position: relative;
      width: 30px;
      height: 16px;
      margin: 0;
      border-radius: 12px;
      background: var(--control-border);
      cursor: pointer;
    }
    .scroll-switch input::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
    }
    .scroll-switch input:checked { background: var(--blue); }
    .scroll-switch input:checked::after { translate: 14px; }
    .alert, .welcome { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--raised); }
    .alert { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--danger); }
    .welcome p { margin-top: 4px; color: var(--muted); }
    .project-loading {
      display: grid;
      flex: 1;
      align-content: center;
      justify-items: center;
      min-height: 280px;
      gap: clamp(16px, 2vw, 26px);
      padding-block: clamp(4px, 2vh, 16px) clamp(10px, 8vh, 72px);
      color: var(--muted);
      text-align: center;
    }
    :root[data-display-mode="fullscreen"] .project-loading { min-height: 0; }
    .loading-visual {
      display: grid;
      width: clamp(120px, min(26vw, 34dvh), 206px);
      aspect-ratio: 1;
      place-items: center;
    }
    .loading-visual > * { grid-area: 1 / 1; }
    .loading-visual img { width: 38%; aspect-ratio: 1; }
    .loading-orbit {
      position: relative;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 5px #5e85f6a6);
      animation: loading-orbit-turn 2.8s linear infinite;
    }
    .loading-orbit::before, .loading-orbit::after { position: absolute; inset: 0; content: ""; }
    .loading-orbit::before {
      border-radius: 50%;
      background: conic-gradient(from -25deg,
        transparent 0deg, #4e79f6 28deg, #93bdff 97deg, #dceaff 110deg, transparent 128deg,
        transparent 188deg, #3c7cf4 218deg, #a1a0ff 270deg, #d2bbff 286deg, transparent 300deg);
      mask-image: radial-gradient(farthest-side, transparent calc(100% - 3.5px),
        #000 calc(100% - 2.7px) calc(100% - .6px), transparent 100%);
    }
    .loading-orbit::after {
      background:
        radial-gradient(circle at 18% 12%, #c0e4ff 0 1px, #5b9cf977 1.5px, transparent 3px),
        radial-gradient(circle at 83% 88%, #c0e4ff 0 1px, #5b9cf977 1.5px, transparent 3px);
    }
    .project-loading p {
      color: color-mix(in srgb, var(--muted) 85%, var(--text));
      font-size: clamp(14px, 1.45vw, 22px);
      font-weight: 500;
    }
    @keyframes loading-orbit-turn { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) {
      .loading-orbit { animation: none; }
    }

    @media (max-width: 1000px) {
      .board {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1.15fr) minmax(0, 1fr);
        height: 740px;
      }
      .workspace { grid-template-columns: minmax(0, .38fr) minmax(0, 1fr); }
    }
    @media (max-width: 560px) {
      .app { padding-inline: calc(9px + var(--safe-left, 0px)) calc(9px + var(--safe-right, 0px)); }
      .masthead { flex-wrap: wrap; row-gap: 5px; }
      .masthead .heading { gap: 7px; }
      .masthead .button { padding-inline: 7px; }
      .masthead .actions { margin-inline-start: auto; }
      .masthead .counts { font-size: 12px; }
      .workspace { grid-template-columns: minmax(105px, .45fr) minmax(0, 1fr); }
      .panel-header h2 { font-size: 16px; }
      .project-panel { padding: 0 4px 4px; }
      .project-heading { gap: 5px; }
      .project-button { gap: 5px; min-height: 33px; padding-inline: 3px; font-size: 12px; }
      .script-panel { padding-inline: 5px; }
      .scope-info { gap: 5px; }
      .scope-info h2 { max-inline-size: 68%; }
      .scope-info .icon { width: 15px; height: 15px; }
      .scope-header .button { padding-inline: 6px; min-height: 27px; font-size: 12px; }
      .search, .toolbar { gap: 5px; }
      .search { padding-inline: 5px; }
      .search input { font-size: 12px; }
      .toolbar .search { flex-basis: 100%; }
      .package-filter { max-width: min(58%, 170px); flex: 1; }
      .package-filter select { height: 31px; font-size: 12px; }
      .package-filter .icon { top: 9px; }
      .filter { min-width: 32px; min-height: 25px; padding-inline: 4px; font-size: 12px; }
      .scripts col:nth-child(1) { width: 28px; }
      .scripts col:nth-child(2), .scripts col:nth-child(3) { width: 35%; }
      .scripts th, .script-row td { padding-inline: 3px; font-size: 11px; }
      .script-package, .command { font-size: 11px; }
      .script-action { width: 24px; min-height: 24px; }

  <main class="app" id="app">
    <header class="masthead">
      <div class="heading">
        <img class="masthead-icon" data-brand-icon alt="">

        <p class="counts" id="counts"></p>
      </div>
      <div class="actions">
        <button class="button icon-only" id="open-floating-window" type="button" data-supported="__SCRIPT_MANAGER_FLOATING_WINDOW__" aria-label="Open Floating Window" hidden disabled><svg class="icon" aria-hidden="true"><use href="#i-floating-window"/></svg></button>
        <button class="button" id="scan" type="button" disabled><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg><span>Rescan</span></button>
        <button class="button primary" id="add-project" type="button" disabled><svg class="icon" aria-hidden="true"><use href="#i-add"/></svg><span>Open Project</span></button>
      </div>
    </header>

    <form class="project-path-form" id="project-path-form" hidden>
      <label class="search">
        <span class="sr-only" data-text="folderPath">Project folder</span>
        <input id="project-path-input" type="text" placeholder="C:\projects\my-app" required maxlength="8192">
      </label>
      <button class="button primary" type="submit" id="project-path-submit" data-text="openProject">Open Project</button>
      <button class="button" type="button" id="project-path-cancel" data-text="cancel">Cancel</button>
    </form>

    <div class="alert" id="error" hidden>
      <p id="error-text" role="alert"></p>
      <button class="button" id="retry" type="button">Reconnect</button>
    </div>

    <section class="project-loading" id="project-loading" role="status">
      <div class="loading-visual" aria-hidden="true">
        <div class="loading-orbit"></div>
        <img data-brand-icon alt="">
      </div>
      <p data-text="scanningProjects">Scanning projects…</p>
    </section>

    <section class="welcome" id="welcome" aria-labelledby="welcome-title" role="status" hidden>
      <h2 id="welcome-title">Connecting to Script Manager</h2>
      <p id="welcome-text">Reading local projects.</p>
    </section>

    <div class="board" id="dashboard" hidden>
      <div class="workspace">
        <section class="project-panel" aria-labelledby="projects-heading">
          <div class="panel-header heading project-heading">
            <h2 id="projects-heading" data-text="projects">Projects</h2>

        </section>

        <section class="script-panel" aria-labelledby="scope-title">
          <header class="panel-header scope-header">
            <div class="scope-info" id="scope-info"></div>
            <div class="scope-controls" id="scope-controls"></div>
          </header>
          <p class="command-config-error" id="command-config-error" role="alert" hidden></p>
          <span class="sr-only" id="command-feedback" role="status"></span>

          </div>
          <div class="table-frame" id="script-list" role="region" aria-labelledby="scope-title" tabindex="0">
            <table class="scripts" id="scripts">
              <colgroup><col><col><col><col></colgroup>
              <thead>
                <tr>
                  <th scope="col"><span class="sr-only" data-text="action">Action</span></th>
                  <th scope="col" data-text="script">Script</th>
                  <th scope="col" data-text="command">Command</th>
                  <th scope="col" data-text="status">Status</th>
                </tr>
              </thead>
            </table>
          </div>
          <div class="table-frame" id="external-list" hidden>
            <p class="command-config-error external-feedback" id="external-error" role="alert" hidden></p>
            <p class="project-caption" id="external-status" role="status" hidden></p>
            <ul class="external-list" id="external-rows"></ul>
          </div>
        </section>
      </div>

      <section class="terminal" id="managed-terminal" aria-labelledby="log-heading">
        <div class="panel-header log-header">
          <div class="heading">
            <span class="brand-icon"><img data-brand-icon alt=""></span>
            <h2 id="log-heading" data-text="logs">Logs</h2>

        <div class="log-tabs" id="log-tabs" role="tablist" aria-label="Script runs" hidden></div>

        <span class="sr-only" id="copy-feedback" role="status"></span>
      </section>

          </div>
        </div>
        <pre class="terminal-output" id="external-log" aria-labelledby="external-log-heading" tabindex="0" data-empty></pre>
      </section>
    </div>

      matches.sort((first, second) => Number(Boolean(second.pinned)) - Number(Boolean(first.pinned)));
      const entries = matches.map(({ id, name, path, pinned, activeCount, available }) =>
        ({ id, name, path, pinned, activeCount, available }));
      const signature = JSON.stringify([locale, entries, state.projectId]);
      if (lastProjectList === signature) return;
      lastProjectList = signature;

      const list = ui["project-list"];
      const scrollPosition = list.scrollTop;
      const focus = focusedKey(list);
      const items = entries.map(projectItem);
      if (!entries.length) items.push(node("li", "project-caption", t("noProjects")));
      list.replaceChildren(...items);
      list.scrollTop = scrollPosition;
      if (focus) findFocus(list, focus)?.focus({ preventScroll: true });
    }

    function projectPath(project) {
      const path = Array.from(project.displayPath || project.path || "");
      const split = Math.ceil(path.length / 2);
      const location = node("span", "project-path");
      const end = node("span", "path-end");
      end.append(node("span", "", path.slice(split).join("")));
      location.append(node("span", "path-start truncate", path.slice(0, split).join("")), end);
      location.title = project.path || path.join("");
      return location;
    }

    function renderScope(project, waiting) {
      const scopedError = project.roots?.some((root) => root.commandConfigError === project.commandConfigError);
      const configError = !scopedError && typeof project.commandConfigError === "string" ? project.commandConfigError.trim() : "";
      const alert = ui["command-config-error"];
      alert.hidden = !configError;
      setText(alert, configError);

      const signature = JSON.stringify([
        locale, project.id, project.name, project.path, project.displayPath, project.available,
        state.menuProjectId, waiting
      ]);
      if (lastScope === signature) return;
      lastScope = signature;
      const controls = ui["scope-controls"];
      const focus = focusedKey(controls);
      const heading = node("h2", "truncate", project.name);
      heading.id = "scope-title";
      heading.title = project.name;
      ui["scope-info"].replaceChildren(icon("folder"), heading, projectPath(project));
      controls.replaceChildren(projectMenu(project, waiting));
      if (focus) findFocus(controls, focus)?.focus({ preventScroll: true });
    }

    function packageChoice(root, group) {
      return JSON.stringify([root.path, group.path]);
    }

    function renderPackages(directories, grouped) {
      const packages = new Map();
      for (const { root, entries } of directories) {
        for (const { group } of entries) {
          const key = packageChoice(root, group);
          if (packages.has(key)) continue;
          const label = group.path !== group.name && group.path ? group.name + " · " + group.path : group.name;
          packages.set(key, grouped ? root.name + " / " + label : label);
        }
      }

      const signature = JSON.stringify([locale, [...packages]]);
      const filter = ui["package-filter"];
      if (lastPackages !== signature) {
        lastPackages = signature;
        const options = Array.from(packages).sort((a, b) => a[1].localeCompare(b[1], locale))
          .map(([key, label]) => new Option(label, key));
        filter.replaceChildren(new Option(t("allPackages"), ""), ...options);
      }
      if (state.packageFilter && !packages.has(state.packageFilter)) state.packageFilter = "";
      filter.disabled = !packages.size;
      filter.value = state.packageFilter;
    }

    function showSelectedScript() {
      const { projectId, taskId } = state.logSelection ?? {};
      const key = projectId && taskId ? JSON.stringify(["log", projectId, taskId]) : null;
      if (lastSelectedScript?.dataset.focusKey === key && lastSelectedScript.isConnected) return;
      lastSelectedScript?.setAttribute("aria-pressed", "false");
      lastSelectedScript = key ? findFocus(ui.scripts, key) : null;
      lastSelectedScript?.setAttribute("aria-pressed", "true");
    }

    function commandDirectories(data, project) {
      const primary = project.path || "";
      const directories = new Map((project.roots || []).map((root) => [root.path, { root, entries: [] }]));
      function entriesFor(path) {
        if (!directories.has(path)) {
          const root = { path, name: folderName(path) || project.name };
          if (path === primary) root.available = project.available;
          directories.set(path, { root, entries: [] });
        }
        return directories.get(path).entries;
      }
      if (!directories.size) entriesFor(primary);
      for (const task of projectTasks(data, project)) {
        entriesFor(task.rootPath || primary).push({ task, group: taskPackage(task) });
      }
      for (const candidate of project.candidates || []) {
        const cwd = candidate.cwd || "";
        const group = { path: cwd, name: folderName(cwd) || t("rootPackage") };
        entriesFor(candidate.rootPath || primary).push({ candidate, group });
      }
      return [...directories.values()];
    }

    function directoryKey(project, root) {
      return JSON.stringify(["directory", project.id, root.path]);
    }

    function directoryHeading(project, root, entries, collapsed) {
      const row = node("tr", "directory-heading");
      const cell = node("th");
      cell.scope = "rowgroup";
      cell.colSpan = 4;
      const key = directoryKey(project, root);
      const toggle = button("directory-toggle", "", ["directory", project.id, root.path], () => {
        if (state.collapsedDirectories.has(key)) state.collapsedDirectories.delete(key);
        else state.collapsedDirectories.add(key);
        render();
      });
      toggle.setAttribute("aria-expanded", String(!collapsed));
      toggle.title = root.path;
      const tasks = entries.filter(({ task }) => task).length;
      const count = [
        quantity(tasks, "oneScript", "scriptCount"),
        entries.length > tasks ? t("candidateCount", entries.length - tasks) : ""
      ].filter(Boolean).join(" · ");
      const name = root.name || folderName(root.path);
      toggle.append(icon("chevron"), node("span", "directory-name truncate", name),
        node("span", "directory-path truncate", root.path), node("span", "directory-count", count));
      cell.append(toggle);
      row.append(cell);
      return row;
    }

    function emptyScriptRow(message) {
      const row = node("tr");
      const cell = node("td", "empty", message);
      cell.colSpan = 4;
      row.append(cell);
      return row;
    }

    function renderDirectory(project, directory, grouped, waiting, emptyMessage) {
      const { root, entries, collapsed } = directory;
      const body = node("tbody");
      if (grouped) body.append(directoryHeading(project, root, entries, collapsed));
      if (grouped && collapsed) return body;

      const errors = [grouped && root.available === false ? t("projectUnavailable") : "",
        root.commandConfigError, root.actionError].filter(Boolean);
      if (errors.length) {
        const row = node("tr");
        const cell = node("td", "directory-errors");
        cell.colSpan = 4;
        for (const error of new Set(errors)) cell.append(node("p", "command-config-error", error));
        row.append(cell);
        body.append(row);
      }
      for (const { task, candidate, group } of entries) {
        body.append(task ? scriptRow(project, task, group, root, waiting) : candidateRow(project, candidate, root, waiting));
      }
      if (!entries.length && !errors.length) {
        body.append(emptyScriptRow(grouped ? t(project.scanning ? "scanningFiles" : "noDirectoryScripts") : emptyMessage));
      }
      return body;
    }

    function renderScripts(data, project, waiting) {
      const directories = commandDirectories(data, project);
      const grouped = directories.length > 1;
      renderPackages(directories, grouped);

      const query = state.scriptQuery.trim().toLocaleLowerCase(locale);
      const filtering = query || state.packageFilter || state.activeOnly;
      const visible = directories.map(({ root, entries }) => ({
        root,
        collapsed: state.collapsedDirectories.has(directoryKey(project, root)),
        entries: entries.filter(({ task, candidate, group }) => {
          const item = task || candidate;
          return (!state.activeOnly || (task && taskIsRunning(task))) &&
            (!state.packageFilter || state.packageFilter === packageChoice(root, group)) &&
            textMatches(query, item.name, item.command, item.detail, group.name, group.path, root.name, root.path);
        })
      })).filter(({ entries }) => !filtering || entries.length);
      ui["filter-all"].setAttribute("aria-pressed", String(!state.activeOnly));
      ui["filter-active"].setAttribute("aria-pressed", String(state.activeOnly));
      const noScriptsMessage = data.supportsCustomCommands === true ? "noScripts" : "noScriptsLegacy";
      const emptyMessage = t(!grouped && project.available === false ? "projectUnavailable"
        : filtering ? (query || state.packageFilter ? "noMatches" : "noActive")
        : project.scanning ? "scanningFiles" : noScriptsMessage, commandConfigPath);
      const signature = JSON.stringify([
        locale, project.id, project.scanning, waiting, state.action, grouped, emptyMessage, visible
      ]);

      if (lastScripts === signature) {
        showSelectedScript();
        return;
      }
      lastScripts = signature;
      const list = ui["script-list"];
      const table = ui.scripts;
      const scrollPosition = list.scrollTop;
      const focus = focusedKey(table);
      const bodies = visible.map((directory) => renderDirectory(project, directory, grouped, waiting, emptyMessage));
      if (!bodies.length) {
        const body = node("tbody");
        body.append(emptyScriptRow(emptyMessage));
        bodies.push(body);
      }
      for (const body of Array.from(table.tBodies)) body.remove();
      table.append(...bodies);
      list.scrollTop = scrollPosition;
      showSelectedScript();
      if (focus) {
        const [kind, projectId, itemId] = JSON.parse(focus);
        const next = findFocus(table, focus)
          || (kind === "run" ? findFocus(table, JSON.stringify(["log", projectId, itemId])) : null)
          || (kind === "candidate" ? findFocus(table, JSON.stringify(["directory", projectId, itemId])) || list : null);
        next?.focus({ preventScroll: true });
      }
    }

    function scrollToEnd() {
      ui.log.scrollTop = ui.log.scrollHeight;
    }

    function revealLogTab(tab) {
      if (!tab) return;
      const list = ui["log-tabs"];
      const bounds = list.getBoundingClientRect();
      const position = tab.getBoundingClientRect();
      if (position.left < bounds.left) list.scrollLeft -= bounds.left - position.left;
      else if (position.right > bounds.right) list.scrollLeft += position.right - bounds.right;
    }

    function renderLogTabs(runs) {
      const list = ui["log-tabs"];
      const panel = ui["log-panel"];
      const titles = new Map();
      const actionAvailable = canQueueAction();
      const tabs = runs.map(({ project, task }) => {
        const group = taskPackage(task);
        const rootPath = task.rootPath || project.path || "";
        const root = project.roots?.find(({ path }) => path === rootPath);
        const showRoot = project.roots?.length > 1 || rootPath !== project.path;
        const title = [project.name, showRoot ? root?.name || folderName(rootPath) : null,
          group.path ? group.name : null, task.name].filter(Boolean).join(" / ");
        const location = pathInRoot(rootPath || project.displayPath || "", group.path);
        const starting = pendingStart(project, task);
        titles.set(title, (titles.get(title) ?? 0) + 1);
        return {
          project, task, title, location,
          kind: starting ? "active" : taskKind(task),
          running: starting || taskIsRunning(task)
        };
      });
      const active = tabs.findIndex(({ project, task }) => matchesRun(state.logSelection, project, task));
      const signature = JSON.stringify([locale, actionAvailable, tabs.map(({ project, task, title, location, kind }, index) =>
        [project.id, task.id, title, location, kind, index === active])]);
      if (lastLogTabs !== signature) {
        lastLogTabs = signature;
        const previousKey = list.querySelector('[aria-selected="true"]')?.dataset.focusKey;
        const focus = focusedKey(list);
        const scrollPosition = list.scrollLeft;
        const elements = tabs.map(({ project, task, title, location, kind, running }, index) => {
          const selected = index === active;
          const item = node("div", "log-tab-item");
          item.setAttribute("role", "presentation");
          item.toggleAttribute("data-selected", selected);
          const control = button("log-tab", "", ["log-tab", project.id, task.id], () => chooseLog(project.id, task.id));
          control.id = "script-log-tab-" + index;
          control.title = location ? title + " · " + location : title;
          control.tabIndex = selected ? 0 : -1;
          control.setAttribute("role", "tab");
          control.setAttribute("aria-controls", panel.id);
          control.setAttribute("aria-selected", String(selected));
          const indicator = node("span", "status");
          indicator.dataset.kind = kind;
          indicator.setAttribute("aria-hidden", "true");
          const label = titles.get(title) > 1 && location ? title + " · " + location : title;
          control.append(indicator, node("span", "truncate", label));

          const close = button("log-tab-close", "", ["close-log", project.id, task.id], () => closeLog(project, task));
          const closeLabel = t(running ? "stopAndCloseLogTab" : "closeLogTab", label);
          close.title = closeLabel;
          close.setAttribute("aria-label", closeLabel);
          close.setAttribute("aria-keyshortcuts", "Delete");
          close.tabIndex = selected ? 0 : -1;
          close.disabled = running && !actionAvailable;
          close.append(icon("close"));
          item.append(control, close);
          return { item, control };
        });
        const selectedTab = elements[active]?.control;
        list.hidden = !elements.length;
        list.replaceChildren(...elements.map(({ item }) => item));
        list.scrollLeft = scrollPosition;
        if (selectedTab) {
          panel.setAttribute("role", "tabpanel");
          panel.setAttribute("aria-labelledby", selectedTab.id);
        } else {
          panel.removeAttribute("role");
          panel.removeAttribute("aria-labelledby");
        }
        if (focus) (findFocus(list, focus) ?? selectedTab ?? ui.log).focus({ preventScroll: true });
        if (selectedTab?.dataset.focusKey !== previousKey) revealLogTab(selectedTab?.parentElement);
      }
      return tabs[active];
    }

    function navigateLogTabs(event) {
      const list = ui["log-tabs"];
      const tabs = Array.from(list.querySelectorAll('[role="tab"]'));
      const current = tabs.indexOf(event.target);
      if (current < 0) return;
      if (event.key === "Delete") {
        event.preventDefault();
        tabs[current].parentElement.querySelector(".log-tab-close").click();
        return;
      }
      const next = {
        ArrowLeft: (current + tabs.length - 1) % tabs.length,
        ArrowRight: (current + 1) % tabs.length,
        Home: 0,
        End: tabs.length - 1
      }[event.key];
      if (!Number.isInteger(next)) return;
      event.preventDefault();
      const target = tabs[next];
      const key = target.dataset.focusKey;
      target.click();
      const active = findFocus(list, key);
      active?.focus({ preventScroll: true });
      revealLogTab(active?.parentElement);
    }

    function focusedLogOutput() {
      const { logOutput, logSelection } = state;
      return logOutput && logSelection?.projectId === logOutput.projectId && logSelection.taskId === logOutput.taskId
        ? logOutput : undefined;
    }

    function renderLogText(text, errors) {
      if (!errors.length) {
        ui.log.textContent = text;
        return;
      }
      const lines = text.split("\n");
      const parts = [];
      let start = 0;
      for (const index of errors) {
        if (!Number.isInteger(index) || index < start || index >= lines.length) continue;
        if (start < index) parts.push(lines.slice(start, index).join("\n") + "\n");
        parts.push(node("span", "log-error", lines[index]));
        if (index < lines.length - 1) parts.push("\n");
        start = index + 1;
      }
      if (start < lines.length) parts.push(lines.slice(start).join("\n"));
      ui.log.replaceChildren(...parts);
    }

    function renderLog(data) {
      const run = renderLogTabs(runsInSnapshot(data));
      const output = run ? focusedLogOutput() : undefined;
      const log = output?.text || "";
      const errors = log ? output.errors : [];
      const errorSignature = errors.join(",");
      const text = log || t(!run ? "noRuns" : output === undefined ? "loadingLogs" : "noLogs");
      const logId = run ? JSON.stringify([run.project.id, run.task.id]) : "";
      const switched = logId !== lastLogId;
      ui["log-context"].hidden = !run;
      if (run) {
        const { project, task, title, location, kind } = run;
        setText(ui["log-title"], title);
        ui["log-title"].title = title;
        const path = ui["log-location"];
        path.hidden = !location;
        path.title = location || "";
        setText(path, location);
        setText(ui["log-status"], pendingStart(project, task) ? t("starting") : taskStatus(task));
        ui["log-status"].dataset.kind = kind;
      }
      if (switched || text !== lastLogText || errorSignature !== lastLogErrors) {
        renderLogText(text, errors);
        if (ui["log-auto"].checked) scrollToEnd();
        else if (switched) ui.log.scrollTop = 0;
        lastLogId = logId;
        lastLogText = text;
        lastLogErrors = errorSignature;
      }
      ui.log.toggleAttribute("data-empty", !log);
      ui["log-bottom"].disabled = !log;
      ui["log-copy"].disabled = !log;
      const fix = ui["log-fix"];
      fix.hidden = !run || (!errors.length && run.kind !== "failed");
      fix.disabled = fix.hidden || state.fixPending || state.status !== "ready";
      fix.title = t("aiFixTitle");
      setText(fix, t(state.fixPending ? "aiFixOpening" : "aiFix"));
    }

    function updateCopyFeedback(result) {
      const label = t(result || "copyLogs");
      ui["log-copy"].title = label;
      ui["log-copy"].setAttribute("aria-label", label);
      ui["log-copy"].dataset.copied = String(result === "copied");
      setText(ui["copy-feedback"], result ? label : "");
    }

    function copyThroughSelection(text) {
      const previous = document.activeElement;
      const field = node("textarea", "clipboard-buffer");
      field.value = text;
      field.readOnly = true;
      field.tabIndex = -1;
      document.body.append(field);
      field.select();
      try {
        return document.execCommand("copy");
      } finally {
        field.remove();
        previous?.focus({ preventScroll: true });
      }
    }

    async function copyLogs() {
      const log = focusedLogOutput()?.text;
      if (!log) return;
      let copied = false;
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(log);
          copied = true;
        } else {
          copied = copyThroughSelection(log);
        }
      } catch {
        try { copied = copyThroughSelection(log); } catch { /* The host may block clipboard writes. */ }
      }
      updateCopyFeedback(copied ? "copied" : "copyFailed");
      if (!copied) {
        state.actionError = new LocalizedError("copyFailed");
        render();
      } else if (state.actionError?.key === "copyFailed") {
        state.actionError = null;
        render();
      }
      clearTimeout(state.copyTimer);
      state.copyTimer = setTimeout(() => updateCopyFeedback(""), 1600);
    }

    async function openFloatingWindow() {
      const button = ui["open-floating-window"];
      if (button.hidden || button.disabled) return;
      const project = state.snapshot?.projects.find(({ id, available }) => id === state.projectId && available !== false);
      const requestLocale = locale;
      const args = { locale: requestLocale };
      if (project) args.projectId = project.id;
      state.floatingWindowPending = true;
      if (state.actionError?.key === "floatingWindowFailed") state.actionError = null;
      render();
      try {
        const result = await request("tools/call", { name: toolPrefix + "_open_floating_window", arguments: args });
        if (result?.isError || result?.structuredContent?.opened !== true) {
          const detail = result?.isError ? result.content?.find((part) => part.type === "text")?.text : "";
          throw new LocalizedError("floatingWindowFailed", detail, requestLocale);
        }
      } catch (error) {
        if (state.status !== "closed") state.actionError = error;
      } finally {
        state.floatingWindowPending = false;
        if (state.status !== "closed") render();
      }
    }

    async function openAiFix() {
      const selection = state.logSelection;
      if (!selection || ui["log-fix"].disabled) return;
      const requestLocale = locale;
      state.fixPending = true;
      if (state.actionError?.key === "aiFixFailed") state.actionError = null;
      render();
      try {
        const result = await request("tools/call", {
          name: toolPrefix + "_ai_fix",
          arguments: { ...selection, locale: requestLocale }
        });
        if (result?.isError || result?.structuredContent?.opened !== true) {
          const detail = result?.isError ? result.content?.find((part) => part.type === "text")?.text : "";
          throw new LocalizedError("aiFixFailed", detail, requestLocale);
        }
      } catch (error) {
        if (state.status !== "closed") state.actionError = error;
      } finally {
        state.fixPending = false;
        if (state.status !== "closed") render();
      }
    }

    function closeExternalView() {
      clearTimeout(externalView?.timer);
      externalView = null;
    }

    function externalProcess(view) {
      return view.processes.find(({ id }) => id === view.processId);
    }

    function externalProcessLabel(process) {
      return process.name + " · PID " + process.pid;
    }

    function externalWindows() {
      return state.snapshot?.platform === "windows" || Boolean(browserSession);
    }

    async function externalRequest(view, operation, args, errorKey) {
      const requestLocale = locale;
      const response = await request("tools/call", {
        name: toolPrefix + "_" + operation,
        arguments: { projectId: view.projectId, ...args, locale: requestLocale }
      });
      const data = response?.structuredContent;
      if (response?.isError || data?.schemaVersion !== 2) {
        const detail = response?.isError ? response.content?.find(({ type }) => type === "text")?.text : "";
        throw new LocalizedError(errorKey, detail, requestLocale);
      }
      return data;
    }

    function selectExternalSource(view, stream) {
      const selection = { processId: view.processId, stream };
      if (view.logSelection?.processId === selection.processId && view.logSelection.stream === stream) return;
      view.logSelection = selection;
      view.log = null;
      view.logError = null;
      renderExternal();
      void readExternalLog(view);
    }

    function selectExternalProcess(view, processId) {
      if (view.processId === processId) return;
      view.processId = processId;
      view.confirm = null;
      view.stopError = null;
      selectExternalSource(view, externalProcess(view)?.streams[0]?.id);
    }

    async function readExternalLog(view) {
      const selection = view.logSelection;
      if (!selection?.stream || selection.pending || document.hidden) return;
      selection.pending = true;
      try {
        const { processId, stream } = selection;
        const result = await externalRequest(view, "external_log", { processId, stream }, "externalLogFailed");
        if (externalView !== view || view.logSelection !== selection) return;
        if (typeof result.log !== "string") throw new LocalizedError("externalLogFailed");
        view.log = result.log;
        view.logError = null;
      } catch (error) {
        if (externalView !== view || view.logSelection !== selection) return;
        view.logError = error;
      } finally {
        selection.pending = false;
        if (externalView === view && view.logSelection === selection) renderExternal();
      }
    }

    async function refreshExternal(view = externalView) {
      if (!view || state.status !== "ready" || document.hidden || view.refreshing) return;
      clearTimeout(view.timer);
      view.refreshing = true;
      renderExternal();
      try {
        const unavailable = externalWindows() ? "externalUnavailable" : "externalUnavailableMac";
        const result = await externalRequest(view, "external_processes", {}, unavailable);
        if (externalView !== view) return;
        if (!Array.isArray(result.processes)) throw new LocalizedError(unavailable);
        view.processes = result.processes;
        view.error = null;
        const selected = externalProcess(view);
        if (view.stopNotice && !view.processes.some(({ id }) => id === view.stopNotice.id)) view.stopNotice.gone = true;
        if (view.confirm && !selected?.canStop) view.confirm = null;
        if (!selected) selectExternalProcess(view, view.processes[0]?.id ?? null);
        else if (!selected.streams.some(({ id }) => id === view.logSelection?.stream)) {
          selectExternalSource(view, selected.streams[0]?.id);
        }
        void readExternalLog(view);
      } catch (error) {
        if (externalView === view) view.error = error;
      } finally {
        if (externalView === view) {
          view.refreshing = false;
          view.loaded = true;
          renderExternal();
          if (!document.hidden) view.timer = setTimeout(() => refreshExternal(view), view.error ? 4500 : 2000);
        }
      }
    }

    async function stopExternalProcess() {
      const view = externalView;
      const process = view && externalProcess(view);
      if (!process?.canStop || view.confirm !== process.id || view.stopping) return;
      view.confirm = null;
      view.stopping = true;
      view.stopNotice = null;
      view.stopError = null;
      renderExternal();
      ui["external-log"].focus();
      try {
        const result = await externalRequest(view, "stop_external", { processId: process.id }, "externalStopFailed");
        if (result.stopping !== true) throw new LocalizedError("externalStopFailed");
        view.stopNotice = { id: process.id, label: externalProcessLabel(process) };
      } catch (error) {
        if (view.processId === process.id) view.stopError = error;
      } finally {
        if (externalView === view) {
          view.stopping = false;
          renderExternal();
          void refreshExternal(view);
        }
      }
    }

    function renderExternal() {
      const view = externalView;
      const entry = ui["external-processes"];
      entry.hidden = entry.dataset.supported !== "true";
      entry.disabled = state.status !== "ready" || !state.projectId;
      setText(entry, t(view ? "backToScripts" : "externalProcesses"));
      ui["script-toolbar"].toggleAttribute("data-external", Boolean(view));
      ui["external-refresh"].hidden = !view;
      ui["script-list"].hidden = Boolean(view);
      ui["external-list"].hidden = !view;
      ui["managed-terminal"].hidden = Boolean(view);
      ui["external-terminal"].hidden = !view;
      if (!view) return;

      const selected = externalProcess(view);
      const notice = view.stopNotice;
      const error = view.stopError || view.error;
      const feedback = (notice && t(notice.gone ? "externalGone" : "externalStopRequested", notice.label)) ||
        (!view.loaded && !view.processes.length ? t("externalScan") :
          !view.processes.length && !error ? t("noExternalProcesses") : "");
      setText(ui["external-status"], feedback);
      ui["external-status"].hidden = !feedback;
      setText(ui["external-error"], error ? error.message : "");
      ui["external-error"].hidden = !error;
      ui["external-refresh"].disabled = Boolean(view.refreshing);

      const list = ui["external-rows"];
      const listSignature = JSON.stringify([view.processId, view.processes.map(({ id, name, pid, directory }) => [id, name, pid, directory])]);
      if (view.listSignature !== listSignature) {
        view.listSignature = listSignature;
        const focus = focusedKey(list);
        list.replaceChildren(...view.processes.map((process) => {
          const row = node("li");
          const choose = button("project-button external-row", "", ["external", process.id], () => selectExternalProcess(view, process.id));
          choose.setAttribute("aria-pressed", String(process.id === view.processId));
          choose.title = externalProcessLabel(process) + "\n" + process.directory;
          choose.append(node("span", "truncate", externalProcessLabel(process)), node("span", "log-detail truncate", process.directory));
          row.append(choose);
          return row;
        }));
        if (focus) findFocus(list, focus)?.focus({ preventScroll: true });
      }

      const streams = selected?.streams ?? [];
      const sources = ui["external-source"];
      ui["external-source-group"].hidden = !streams.length;
      const sourceSignature = JSON.stringify(streams);
      if (view.sourceSignature !== sourceSignature) {
        view.sourceSignature = sourceSignature;
        sources.replaceChildren(...streams.map(({ id, label }) => new Option(label, id)));
      }
      if (streams.length) sources.value = view.logSelection?.stream ?? "";
      ui["external-stop"].hidden = !selected?.canStop;
      ui["external-stop"].disabled = Boolean(view.stopping || view.confirm);
      ui["external-confirm"].hidden = view.confirm == null;
      const confirmKey = externalWindows() ? "confirmExternalStopWindows" : "confirmExternalStop";
      setText(ui["external-confirm-text"], view.confirm && selected ? t(confirmKey, externalProcessLabel(selected)) : "");

      const output = ui["external-log"];
      const atEnd = output.scrollHeight - output.scrollTop - output.clientHeight <= 8;
      const content = view.logError?.message ?? (view.log || t(view.log !== null ? "noLogs"
        : streams.length ? "loadingLogs" : selected ? "noExternalLogFile" : "noExternalSelection"));
      output.toggleAttribute("data-empty", Boolean(view.logError || !view.log));
      setText(output, content);
      if (atEnd) output.scrollTop = output.scrollHeight;
    }

    function render() {
      const data = state.snapshot;
      const picking = Boolean(data?.pickPending || state.action?.name === "choose");
      const waiting = picking || Boolean(state.action) || state.status !== "ready";
      const problem = state.actionError || state.transportError;
      const error = problem ? problem.message || t("operationError") : data?.pickerError || "";
      setText(ui["error-text"], error);
      ui.error.hidden = !error;
      setText(ui.retry, t(state.status === "ready" ? "refreshStatus" : "reconnect"));
      ui.retry.disabled = Boolean(state.action) || state.status === "connecting";
      const floatingWindow = ui["open-floating-window"];
      floatingWindow.hidden = floatingWindow.dataset.supported !== "true";
      floatingWindow.disabled = floatingWindow.hidden || waiting || state.floatingWindowPending;
      const floatingWindowLabel = t(state.floatingWindowPending ? "floatingWindowOpening" : "openFloatingWindow");
      floatingWindow.title = floatingWindowLabel;
      floatingWindow.setAttribute("aria-label", floatingWindowLabel);
      ui["add-project"].disabled = waiting;
      setText(ui["add-project"].lastElementChild, t(picking ? "waitingForFolder" : "openProject"));
      ui["project-path-submit"].disabled = waiting;
      ui["project-path-cancel"].disabled = state.action?.name === "add";
      const loading = !state.initialLoadComplete && !state.transportError && !(state.actionError && !data);
      const scanning = state.action?.name === "refresh" || data?.projects.some((project) => project.scanning);
      ui.scan.disabled = waiting || !state.initialLoadComplete || !data || scanning;
      setText(ui.scan.lastElementChild, t(scanning && !loading ? "scanning" : "rescan"));

      const hasProjects = Boolean(data?.projects.length);
      ui["project-loading"].hidden = !loading;
      ui.dashboard.hidden = loading || !hasProjects;
      renderExternal();
      ui.welcome.hidden = loading || hasProjects || Boolean(error && !data);
      if (hasProjects && !loading) {
        const { projects } = data;
        const scripts = projects.reduce((count, project) => count + projectTasks(data, project).length, 0);
        setText(ui.counts, quantity(projects.length, "oneProject", "projectCount") + " · " +
          quantity(scripts, "oneScript", "scriptCount"));
        setText(ui["project-count"], new Intl.NumberFormat(locale).format(projects.length));
        const project = projects.find(({ id }) => id === state.projectId);
        renderProjectList(projects);
        renderScope(project, waiting);
        renderScripts(data, project, waiting);
        renderLog(data);
      } else {
        setText(ui.counts, "");
        setText(ui["welcome-title"], t(data ? "selectProject" : error ? "unavailable" : "connecting"));
        setText(ui["welcome-text"], t(picking ? "selectFolderHint" :
          data ? "selectProjectHint" : error ? "reconnectHint" : "loadingProjects"));
      }
    }

    function onVisibilityChange() {
      if (document.hidden) {
        clearTimeout(state.timer);
        clearTimeout(externalView?.timer);
      } else {
        schedule(0);
        void refreshExternal();
      }
    }

    function dispose() {
      if (state.status === "closed") return;
      state.status = "closed";
      clearTimeout(state.timer);
      clearTimeout(state.copyTimer);
      closeExternalView();
      for (const pending of requests.values()) {
        clearTimeout(pending.timer);
        pending.reject(new LocalizedError("closed"));
      }
      requests.clear();
      observer.disconnect();
      localeObserver.disconnect();
      browserTheme.removeEventListener("change", applyTheme);
      window.removeEventListener("message", onMessage);
      document.removeEventListener("visibilitychange", onVisibilityChange);
      document.removeEventListener("click", closeOutsideMenu);
      document.removeEventListener("keydown", dismissMenu);
    }

    function closeOutsideMenu(event) {
      if (state.menuProjectId && !event.target.closest(".project-menu")) setMenu(null);
    }

    function dismissMenu(event) {
      if (!state.menuProjectId || event.key !== "Escape") return;
      const key = JSON.stringify(["open-in", state.menuProjectId]);
      setMenu(null);
      findFocus(ui["scope-controls"], key)?.focus();
    }

    function closeProjectPathForm() {
      ui["project-path-form"].reset();
      ui["project-path-form"].hidden = true;
    }

    ui["add-project"].addEventListener("click", () => {
      if (!state.snapshot?.usesPathPicker) {
        queueAction("choose");
        return;
      }
      ui["project-path-form"].hidden = false;
      ui["project-path-input"].focus();
    });
    ui["project-path-form"].addEventListener("submit", (event) => {
      event.preventDefault();
      const path = ui["project-path-input"].value;
      if (path.trim()) queueAction("add", { path });
    });
    ui["project-path-cancel"].addEventListener("click", () => {
      closeProjectPathForm();
      ui["add-project"].focus();
    });
    ui["open-floating-window"].addEventListener("click", openFloatingWindow);
    ui.scan.addEventListener("click", () => queueAction("refresh"));
    ui["external-processes"].addEventListener("click", () => {
      if (externalView) closeExternalView();
      else externalView = { projectId: state.projectId, processes: [], processId: null, log: null };
      renderExternal();
      void refreshExternal();
    });
    ui["external-refresh"].addEventListener("click", () => void refreshExternal());
    ui["external-source"].addEventListener("change", (event) => {
      if (externalView) selectExternalSource(externalView, event.target.value);
    });
    ui["external-stop"].addEventListener("click", () => {
      const process = externalView && externalProcess(externalView);
      if (!process?.canStop) return;
      externalView.confirm = process.id;
      renderExternal();
      ui["external-cancel"].focus();
    });
    ui["external-cancel"].addEventListener("click", () => {
      if (!externalView) return;
      externalView.confirm = null;
      renderExternal();
      ui["external-stop"].focus();
    });
    ui["external-confirm-stop"].addEventListener("click", stopExternalProcess);
    ui["project-search"].addEventListener("input", () => {
      state.projectQuery = ui["project-search"].value;
      ui["project-list"].scrollTop = 0;
      render();
    });
    ui["script-search"].addEventListener("input", () => {
      state.scriptQuery = ui["script-search"].value;
      ui["script-list"].scrollTop = 0;
      render();
    });
    ui["package-filter"].addEventListener("change", () => {
      state.packageFilter = ui["package-filter"].value;
      ui["script-list"].scrollTop = 0;
      render();
    });
    for (const [id, activeOnly] of [["filter-all", false], ["filter-active", true]]) {
      ui[id].addEventListener("click", () => {
        state.activeOnly = activeOnly;
        ui["script-list"].scrollTop = 0;
        render();
      });
    }
    ui.retry.addEventListener("click", () => {
      state.actionError = null;
      if (state.status === "ready") schedule(0);
      else void connect();
      render();
    });
    ui["log-tabs"].addEventListener("keydown", navigateLogTabs);
    ui["log-copy"].addEventListener("click", copyLogs);
    ui["log-fix"].addEventListener("click", openAiFix);
    ui["log-bottom"].addEventListener("click", scrollToEnd);
    ui["log-auto"].addEventListener("change", () => {
      if (ui["log-auto"].checked) scrollToEnd();
    });
    document.addEventListener("click", closeOutsideMenu);
    document.addEventListener("keydown", dismissMenu);
    document.addEventListener("visibilitychange", onVisibilityChange);
    window.addEventListener("message", onMessage);
    window.addEventListener("pagehide", (event) => {
      if (!event.persisted) dispose();
    });
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        schedule(0);
        void refreshExternal();
      }
    });
    browserTheme.addEventListener("change", applyTheme);
    const observer = new ResizeObserver(reportSize);
    observer.observe(ui.app);
    const localeObserver = new MutationObserver(() => {
      const nextDocumentLocale = document.documentElement.lang;
      if (nextDocumentLocale === locale) return;
      documentLocale = nextDocumentLocale;
      applyLocale();
    });
    localeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
    applyLocale();
    applyTheme();
    void connect();
  </script>
</body>
</html>
